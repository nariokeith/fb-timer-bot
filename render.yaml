services:
  - type: web
    name: fb-timer-bot
    runtime: python
    plan: free
    # Free services egress through one shared NAT address per region, and
    # Oregon's (74.220.48.29) is banned by Discord's edge -- Cloudflare
    # error 1015, which no redeploy escapes because every container comes
    # back on the same address. A different region means a different pool.
    # Singapore is also the closest one to the guild's Asia/Manila players.
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -u supervisor.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_TZ
        value: Asia/Manila
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ATTENDANCE_DISCORD_TOKEN
        sync: false
      - key: SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ITEMS_DISCORD_TOKEN
        sync: false
      - key: ITEMS_SHEET_ID
        sync: false
      - key: ITEMS_GEAR_DAILY_CAP
        value: "3"
