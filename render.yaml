services:
  - type: web
    name: fb-timer-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u supervisor.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_TZ
        value: Asia/Manila
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ATTENDANCE_DISCORD_TOKEN
        sync: false
      - key: SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ITEMS_DISCORD_TOKEN
        sync: false
      - key: ITEMS_SHEET_ID
        sync: false
      - key: ITEMS_GEAR_DAILY_CAP
        value: "3"
